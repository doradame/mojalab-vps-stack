# Caddy JSON access log: unauthenticated probes for secrets / known-vulnerable
# paths (.env, .git, wp-login.php, actuator, phpmyadmin, ...).
#
# Only requests that were NOT served to a logged-in user count:
#   - status 302/401 on a protected site = refused by Authelia's forward_auth
#   - any status on auth.* (the portal has nothing at these paths)
# so an authenticated user browsing e.g. a .git folder in Filestash (status
# 200/404 behind Authelia) can never match.
#
# Anchored on the "client_ip" key, which Caddy writes before any request
# header: a header value can't fake it (its quotes would be escaped as \").

[Definition]

_paths = (?:(?:/|%%2[fF])(?:\.|%%2[eE])(?:env|git|svn|hg|aws|ssh|boto|docker|circleci|vscode|npmrc|pypirc|htaccess|htpasswd|DS_Store|auth\.json)|wp-(?:admin|login|content|includes|config)|xmlrpc\.php|\.php(?:$|\?|/)|phpmyadmin|actuator|cgi-bin|/vendor/|server-status|/HNAP1|/boaform|/solr/|/telescope|/\.well-known/(?:agent|agents)[.-])

_prefix = ^.*?"client_ip":"<HOST>","proto":"[^"]*","method":"[^"]*",

failregex = %(_prefix)s"host":"[^"]*","uri":"[^"]*%(_paths)s[^"]*",.*"status":(?:302|401),
            %(_prefix)s"host":"auth\.[^"]*","uri":"[^"]*%(_paths)s[^"]*",

ignoreregex =

datepattern = "ts":{EPOCH}
