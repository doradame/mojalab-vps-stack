# Caddy JSON access log: any request answered by the ':80, :443' catch-all
# site (bare IP or unknown Host header). A real user always uses one of the
# named subdomains, so whoever lands here is a scanner.
# Relies on the catch-all site logging under the name 'catchall' (Caddyfile).

[Definition]

failregex = ^.*?"logger":"http\.log\.access\.catchall".*?"client_ip":"<HOST>",

ignoreregex =

datepattern = "ts":{EPOCH}
