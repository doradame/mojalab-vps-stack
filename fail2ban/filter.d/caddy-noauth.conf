# Caddy JSON access log: any request refused by Authelia's forward_auth
# (302 to the login portal, or 401 for XHR/WebSocket) on a protected site.
# One alone means nothing (an expired session does it); the jail only bans on
# volume. Requests to auth.* itself are excluded.

[Definition]

failregex = ^.*?"client_ip":"<HOST>","proto":"[^"]*","method":"[^"]*","host":"(?!auth\.)[^"]*",.*"status":(?:302|401),

ignoreregex =

datepattern = "ts":{EPOCH}
