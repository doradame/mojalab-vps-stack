# ============================================================================
# mojalab-vps-stack — Browser-first homelab on a single Hetzner VPS
# ============================================================================
# A complete Docker Compose stack for a self-hosted, browser-accessible homelab
# with SSO+2FA on every service.
#
# Companion repository for the article:
# https://mojalab.com/browser-first-vps-for-coding-agents/
#
# Stack:
#   - Caddy            reverse proxy + automatic HTTPS
#   - Authelia         SSO + TOTP 2FA gate
#   - Filestash        web file manager
#   - Zellij           persistent web terminal
#   - wetty            mobile web terminal (SSH into the Zellij container)
#   - Glances          system metrics dashboard
#   - tgbot            Telegram bot: status commands + proactive alerts
#   - dockerproxy      least-privilege Docker socket proxy
#
# Read README.md before deploying. Run scripts/install.sh for guided setup.
# ============================================================================

services:

  # --------------------------------------------------------------------------
  # Caddy — the front door. Handles TLS, routing, and forward_auth checks.
  # --------------------------------------------------------------------------
  caddy:
    build:
      context: ./caddy
      dockerfile: Dockerfile
    image: mojalab/caddy:replace-response
    pull_policy: build      # locally-built image, do not try to pull from a registry
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/home:/srv/home:ro
      - ./caddy/overlay:/srv/wetty-overlay:ro
      # JSON access log on the host, read by fail2ban (see fail2ban/).
      - ./caddy/logs:/var/log/caddy
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN}
      - ACME_EMAIL=${ACME_EMAIL}
    networks:
      - lab
    depends_on:
      authelia:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --------------------------------------------------------------------------
  # Authelia — the lock. Single sign-on with TOTP second factor.
  # --------------------------------------------------------------------------
  authelia:
    # Exact version, not the floating '4' tag. To update: check
    # https://github.com/authelia/authelia/releases and bump.
    image: authelia/authelia:4.39.28
    container_name: authelia
    restart: unless-stopped
    # tty:true makes the Docker logs API emit a plain (non-multiplexed) stream
    # so tgbot can tail it line-by-line via dockerproxy. Authelia's stdout is
    # text-only logfmt, so this has no other side effect.
    tty: true
    volumes:
      - ./authelia:/config
    environment:
      - TZ=${TZ:-Europe/Rome}
      - AUTHELIA_JWT_SECRET_FILE=/config/secrets/jwt_secret
      - AUTHELIA_SESSION_SECRET_FILE=/config/secrets/session_secret
      - AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE=/config/secrets/storage_encryption_key
      - AUTHELIA_NOTIFIER_SMTP_PASSWORD_FILE=/config/secrets/smtp_password
    networks:
      - lab
    expose:
      - 9091
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9091/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --------------------------------------------------------------------------
  # Filestash — the workbench surface. Web file manager with in-browser editing.
  # --------------------------------------------------------------------------

  # Init helper: merges filestash/config-overrides.json (git-tracked UI
  # preferences: list view with size+mtime, sort by date, show hidden files)
  # into the runtime config.json BEFORE filestash starts. The runtime config
  # holds secrets (admin hash, secret key) so it can't live in git; deep-merge
  # lets us version only the harmless UI bits. Idempotent on every start.
  # yq image (alpine) because the official jq image is FROM scratch — no shell.
  filestash-init:
    image: mikefarah/yq:4.54.3
    container_name: filestash-init
    user: "0"
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        mkdir -p /state/config
        cd /state/config
        [ -s config.json ] || echo '{}' > config.json
        owner="$$(stat -c '%u:%g' config.json)"
        yq -p=json -o=json eval-all 'select(fileIndex==0) * select(fileIndex==1)' \
            config.json /overrides.json > config.json.tmp
        mv config.json.tmp config.json
        chown "$$owner" config.json
        echo "filestash config.json merged with overrides"
    volumes:
      - filestash_data:/state
      - ./filestash/config-overrides.json:/overrides.json:ro
    restart: "no"

  filestash:
    # Filestash publishes no stable version tags (only 'latest' + stale commit
    # hashes), so we pin by digest. To update: check the release notes, then
    #   curl -fsS https://hub.docker.com/v2/repositories/machines/filestash/tags/latest | jq -r .digest
    # and replace the digest below.
    image: machines/filestash:latest@sha256:af215fc7a8ac25e3689d70ba4df6e4961d49fb13fd5bbe9f718717feabc984b1
    container_name: filestash
    restart: unless-stopped
    depends_on:
      filestash-init:
        condition: service_completed_successfully
    environment:
      - APPLICATION_URL=files.${DOMAIN}
      - TZ=${TZ:-Europe/Rome}
    volumes:
      - filestash_data:/app/data/state
      - /srv:/mnt/data:rw       # The host filesystem area to expose
    networks:
      - lab
    expose:
      - 8334
    healthcheck:
      # filestash image ships curl, not wget.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8334/about >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --------------------------------------------------------------------------
  # Zellij — the workbench itself. Persistent terminal sessions in the browser.
  # NOTE: Zellij's web client runs as a non-root user; the entrypoint serves it
  # on 0.0.0.0:8082. The login token must be created interactively (see README).
  # --------------------------------------------------------------------------
  zellij:
    build:
      context: ./zellij
      dockerfile: Dockerfile
      args:
        # Nothing notifies you about new Zellij releases: bump this in .env
        # now and then and rebuild (docker compose up -d --build zellij).
        ZELLIJ_VERSION: ${ZELLIJ_VERSION:-0.44.1}
        # Checksums for the default version are baked into zellij/Dockerfile.
        # For any other version set ZELLIJ_SHA256 in .env (see .env.example),
        # otherwise the download is NOT verified.
        ZELLIJ_SHA256: ${ZELLIJ_SHA256:-}
    container_name: zellij
    restart: unless-stopped
    # tini as PID 1. Without it PID 1 is 'zellij web', which never reaps
    # orphaned processes: every orphan an agent or test run leaves behind
    # becomes a permanent zombie holding a PID, until the 'pids' limit below
    # is exhausted and nothing in the container can fork any more.
    init: true
    environment:
      - TZ=${TZ:-Europe/Rome}
      - LAB_BRAND=${BRAND_NAME:-mojalab}
    volumes:
      # --- System state (named volumes, hidden from host browsing) -------
      - zellij_config:/home/lab/.config/zellij
      - zellij_cache:/home/lab/.cache/zellij    # web tokens (older zellij)
      - zellij_data:/home/lab/.local/share/zellij  # web tokens (zellij 0.44+)
      - wetty_keys:/ssh-keys                    # shared with wetty (RW here)

      # --- Dev user state (bind mounts on host, easy backup, OUT of /srv
      #     so Filestash CANNOT see your secrets/credentials) -------------
      - ${LAB_STATE_DIR:-/var/lib/mojalab/lab}/local:/home/lab/.local       # pip --user, npm globals, ~/.local/bin, secrets.env
      - ${LAB_STATE_DIR:-/var/lib/mojalab/lab}/config:/home/lab/.config     # opencode, gh, git, XDG configs
      - ${LAB_STATE_DIR:-/var/lib/mojalab/lab}/claude:/home/lab/.claude     # Claude Code auth + state
      - ${LAB_STATE_DIR:-/var/lib/mojalab/lab}/npm:/home/lab/.npm           # npm cache

      # --- Workspace under /srv so Filestash (files.${DOMAIN}) can browse,
      #     upload, download project files from the web --------------------
      - /srv/workspace:/home/lab/workspace
      - /srv:/srv:rw            # Same /srv mount as Filestash, so terminal and
                                 # file manager see the same tree
    networks:
      - lab
    expose:
      - 8082
      - 22         # sshd — used internally by wetty for the mobile web terminal
    healthcheck:
      test: ["CMD-SHELL", "ss -ltn 'sport = :8082' | grep -q LISTEN || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          # This is the dev workbench: coding agents (Claude Code, Codex,
          # opencode, …) compile and run tests HERE. Size it to the host via
          # .env — the installer suggests values (host RAM minus ~3G).
          # NOTE: exceeding the memory limit gets the biggest process
          # OOM-killed, which is often zellij itself → all sessions lost.
          memory: ${ZELLIJ_MEM_LIMIT:-2G}
          cpus: '${ZELLIJ_CPU_LIMIT:-2.0}'
          # Safety net against accidental fork bombs from agent-run tests:
          # far above any real build's needs, but keeps the host schedulable.
          pids: 4096
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --------------------------------------------------------------------------
  # wetty — mobile-friendly web terminal. Connects via SSH to the zellij
  # sidecar over the internal 'lab' network and auto-attaches to session 'main'
  # (handled by the lab user's .bashrc). Replaces ttyd, which ate keystrokes
  # on phones because of textarea autocorrect.
  # --------------------------------------------------------------------------
  wetty:
    build:
      context: ./wetty
      dockerfile: Dockerfile
    container_name: wetty
    restart: unless-stopped
    environment:
      - TERM=xterm-256color
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
    command:
      - "--ssh-host=zellij"
      - "--ssh-port=22"
      - "--ssh-user=lab"
      - "--ssh-auth=publickey"
      - "--ssh-key=/ssh-keys/wetty_id_ed25519"
      - "--base=/"
      - "--port=3000"
    volumes:
      - wetty_keys:/ssh-keys:ro
    networks:
      - lab
    expose:
      - 3000
    depends_on:
      - zellij
    healthcheck:
      # The wetty image has no curl/wget; use the node runtime it ships with.
      # Any HTTP response (even 302) means the server is up.
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/',()=>process.exit(0)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --------------------------------------------------------------------------
  # dockerproxy — minimal Docker API exposed read-only to Glances & tgbot.
  # Replaces direct mount of /var/run/docker.sock into those services.
  # --------------------------------------------------------------------------
  dockerproxy:
    # Pinned for reproducibility. Nothing notifies you about new releases of
    # the pinned images — check upstream release pages when bumping versions.
    image: tecnativa/docker-socket-proxy:v0.4.2
    container_name: dockerproxy
    restart: unless-stopped
    environment:
      # Read-only access to the bits Glances & tgbot actually need.
      # Glances:  CONTAINERS, IMAGES, INFO, VERSION (and PING for liveness)
      # tgbot:    CONTAINERS + LOGS (authelia log stream)
      - CONTAINERS=1
      - IMAGES=1
      - INFO=1
      - VERSION=1
      - PING=1
      - LOGS=1       # tgbot tails authelia logs to alert on web logins
      - POST=0       # Deny any write/exec/start/stop call
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - lab
    expose:
      - 2375
    read_only: true
    tmpfs:
      - /run
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --------------------------------------------------------------------------
  # Glances — the dashboard pane. System metrics, container stats, network I/O.
  # --------------------------------------------------------------------------
  glances:
    image: nicolargo/glances:4.5.5-full
    container_name: glances
    restart: unless-stopped
    pid: host
    environment:
      - TZ=${TZ:-Europe/Rome}
      - GLANCES_OPT=-w
      - DOCKER_HOST=tcp://dockerproxy:2375
      - DOCKER_API_VERSION=1.45
    networks:
      - lab
    expose:
      - 61208
    depends_on:
      - dockerproxy
    healthcheck:
      # Use GET (not --spider/HEAD): glances' web UI is FastAPI-based and
      # rejects HEAD on /. -O /dev/null discards the body.
      # 127.0.0.1 (not localhost) — uvicorn binds 0.0.0.0 only, so the
      # IPv6 ::1 path fails with "Connection refused".
      test: ["CMD-SHELL", "wget --quiet -O /dev/null http://127.0.0.1:61208/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --------------------------------------------------------------------------
  # tgbot — Telegram bot that answers /stats, /df, /uptime by querying Glances.
  # Single-user: only TELEGRAM_CHAT_ID is allowed to issue commands.
  # --------------------------------------------------------------------------
  tgbot:
    build:
      context: ./tgbot
      dockerfile: Dockerfile
    container_name: tgbot
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Rome}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - GLANCES_URL=http://glances:61208
      # Proactive alerts (set any to 0 to disable)
      - ALERT_DISK_PCT=${ALERT_DISK_PCT:-85}
      - ALERT_MEM_PCT=${ALERT_MEM_PCT:-90}
      - ALERT_LOAD=${ALERT_LOAD:-0}
      - HEARTBEAT_HOURS=${HEARTBEAT_HOURS:-3}
      - ALERT_SSH=${ALERT_SSH:-1}
      - ALERT_AUTHELIA=${ALERT_AUTHELIA:-1}
      - DOCKER_HOST=tcp://dockerproxy:2375
      - ALERT_COOLDOWN=${ALERT_COOLDOWN:-3600}
    volumes:
      # Read-only host logs so the watcher can detect SSH logins.
      # Best-effort: only Debian/Ubuntu have /var/log/auth.log.
      - /var/log:/var/log:ro
    # auth.log is 0640 syslog:adm on Debian/Ubuntu, and the bot runs as an
    # unprivileged UID with all capabilities dropped — without the host's
    # 'adm' GID as a supplementary group the SSH login watcher can't read it
    # and silently disables itself. GID 4 is 'adm' on Debian/Ubuntu; check
    # with `getent group adm` and override AUTHLOG_GID in .env if it differs.
    group_add:
      - "${AUTHLOG_GID:-4}"
    tmpfs:
      - /tmp/tgbot:size=4M,uid=1000,gid=1000
    networks:
      - lab
    depends_on:
      - glances
      - dockerproxy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# ============================================================================
# Networks & volumes
# ============================================================================
networks:
  lab:
    name: lab
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  filestash_data:
  zellij_config:
  zellij_cache:
  zellij_data:
  wetty_keys:
